# Configuração para desenvolvimento local (supabase start).
# Em produção, aplique as mesmas escolhas no painel do Supabase (ver README).
project_id = "rara-ia"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[functions.greenn-webhook]
verify_jwt = false

[functions.account-delete]
verify_jwt = true
