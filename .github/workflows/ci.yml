name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  banco:
    name: Testes de segurança do banco
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: tests/db/run.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  funcoes:
    name: Testes e tipos das funções
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test 'tests/unit/*.test.ts'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=none supabase/functions/*/index.ts

  segredos:
    name: Varredura de chaves vazadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
