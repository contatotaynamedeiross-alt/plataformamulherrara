name: CI

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # 1. Verificação de segredos vazados
  # ──────────────────────────────────────────────
  secrets-scan:
    name: Verificar segredos vazados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # 2. Verificação de tipos nas Edge Functions
  # ──────────────────────────────────────────────
  deno-check:
    name: deno check (Edge Functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Verificar tipos
        run: deno check supabase/functions/*/index.ts

  # ──────────────────────────────────────────────
  # 3. Testes unitários
  # ──────────────────────────────────────────────
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Rodar testes
        run: deno test --allow-env tests/unit/

  # ──────────────────────────────────────────────
  # 4. Validação de migrações SQL (lint)
  # ──────────────────────────────────────────────
  sql-lint:
    name: Lint SQL (migrações)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar sqlfluff
        run: pip install sqlfluff

      - name: Lint migrações
        run: |
          sqlfluff lint \
            --dialect postgres \
            --exclude-rules L016,L034 \
            supabase/migrations/
