name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Supabase (banco + funções)
    runs-on: ubuntu-latest
    needs: []
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.26.9

      - name: Linkar projeto
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configurar secrets da função
        run: |
          supabase secrets set \
            ASAAS_WEBHOOK_TOKEN="${{ secrets.ASAAS_WEBHOOK_TOKEN }}" \
            APP_URL="${{ vars.APP_URL }}" \
            ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS }}" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Aplicar migrations (db push)
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy função asaas-webhook
        run: supabase functions deploy asaas-webhook --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy função account-delete
        run: supabase functions deploy account-delete
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy função calcular-diagnostico
        run: supabase functions deploy calcular-diagnostico
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy função jornada-chat
        run: supabase functions deploy jornada-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: URL do webhook
        run: |
          echo "✅ Deploy concluído!"
          echo "🔗 URL do webhook Asaas:"
          echo "   https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/asaas-webhook"
